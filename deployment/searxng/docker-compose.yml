# SearXNG Docker Compose stack for AURA Deep Research
#
# Quick start (Windows, PowerShell):
#   cd deployment/searxng
#   docker compose up -d
#
# Or point AURA at it by setting in .env:
#   SEARXNG_ENABLED=1
#   SEARXNG_DOCKER_PROJECT_DIR=deployment/searxng
#
# Verify the JSON API works:
#   curl "http://localhost:8080/search?q=test&format=json"
# ---------------------------------------------------------------------------

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8080:8080"
    volumes:
      # settings.yml is mounted read-only so you can edit it locally.
      # After editing, restart the container: docker compose restart searxng
      - ./settings.yml:/etc/searxng/settings.yml
      # Persistent cache (avoids repeated DNS lookups after restart)
      - searxng_data:/var/cache/searxng
    environment:
      # MUST be set to a long random string in production.
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - SEARXNG_SECRET_KEY=fbcff5cc86e66e3466ae0822ac62775dcb1b0c5f5c069ebe7b4a3eedffb4fbd8
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8080/search?q=health&format=json' | grep -q results || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  searxng_data:
